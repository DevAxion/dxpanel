services:
  dxpanel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dxpanel:latest
    container_name: dxpanel
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # SQLite lives on the named volume by default. To use the MySQL service
      # instead, point the connection string at it here.
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/dxpanel.db"
      # Persist DataProtection keys on the volume (survives restarts).
      DataProtection__KeysDirectory: "/app/data/keys"
      # The nginx service in front of us terminates TLS and forwards X-Forwarded-*.
      ForwardedHeaders__Enabled: "true"
      Version: "1.0.0"
      UpdateChannel: "stable"
      # Default to simulation: this container runs the panel only, not a full
      # hosting node (no nginx/bind/postfix inside). Set SIMULATION_MODE=false in
      # .env when deploying on a real host with the services installed.
      SimulationMode: "${SIMULATION_MODE:-true}"
      # Password for the initial 'admin' account. If left blank the app generates
      # a random one and prints it to the log on first start.
      DXPANEL_ADMIN_PASSWORD: "${DXPANEL_ADMIN_PASSWORD:-}"
      Panel__Hostname: "${PANEL_DOMAIN}"
      Panel__LetsEncryptEmail: "${LETSENCRYPT_EMAIL}"
      Panel__MySql__Host: "mysql"
      Panel__MySql__RootUser: "root"
      Panel__MySql__RootPassword: "${MYSQL_ROOT_PASSWORD}"
      Stripe__PublishableKey: "${STRIPE_PUBLISHABLE_KEY}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
    volumes:
      - dx_data:/app/data
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8
    container_name: dxpanel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-dxpanel}"
      MYSQL_USER: "${MYSQL_USER:-dxpanel}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - dx_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: dxpanel-nginx
    restart: unless-stopped
    depends_on:
      - dxpanel
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - dx_certs:/etc/letsencrypt
      - dx_certbot_www:/var/www/certbot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: dxpanel-certbot
    restart: unless-stopped
    volumes:
      - dx_certs:/etc/letsencrypt
      - dx_certbot_www:/var/www/certbot
    # Renew every 12h; nginx picks up new certs on reload.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

volumes:
  dx_data:
  dx_mysql:
  dx_certs:
  dx_certbot_www:
